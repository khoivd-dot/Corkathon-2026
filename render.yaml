# Render Blueprint. Approved by Tran: Starter web service + 1 GB disk.
# Auto-deploy is OFF: a deploy needs Tran's explicit yes. No secrets here.
services:
  - type: web
    name: corkathon
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: "echo 'stdlib only, nothing to install'"
    startCommand: "PYTHONPATH=src python -m corkathon.server"
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CACHE_DIR
        value: /var/data/cache
      - key: REFRESH_S
        value: "1800"
      - key: CONFIRMATION_ENABLED
        value: "0"   # official-page confirmation: on only once page reuse terms are recorded
      - key: WEATHER_ENABLED
        value: "1"   # Open-Meteo port forecasts: keyless, CC BY 4.0, non-commercial use
      - key: AIS_ENABLED
        value: "0"   # AISHub ship counts: also needs AISHUB_USERNAME set in the dashboard, not here
      - key: AIS_LIVE_ENABLED
        value: "1"   # live ship position by MMSI (aisstream.io): stays off until AISSTREAM_API_KEY is set
      - key: AISSTREAM_API_KEY
        sync: false  # secret: paste it in the Render dashboard, never in this file
      - key: LANE_PORTS
        value: "Rotterdam,Antwerp,Felixstowe,Dublin,Cork"
    disk:
      name: cache
      mountPath: /var/data
      sizeGB: 1
